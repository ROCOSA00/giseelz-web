<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · GISELZ</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a0c">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <!-- Página que sale si alguien entra en una dirección que no existe (la usa Vercel sola) -->
  <style>
    @font-face { font-family: "Anton"; src: url("/assets/fonts/anton.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/assets/fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --pink: #ff2e93; --ink: #0b0a0c; --white: #fff7fb; --muted: #cdb9c4; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(closest-side, rgba(255, 46, 147, .25), transparent 70%) center / 120vmax 80vmax no-repeat, var(--ink);
      color: var(--white); font-family: "Inter", system-ui, sans-serif; text-align: center;
    }
    main { max-width: 34rem; }
    img { width: 150px; height: auto; margin-bottom: 24px; }
    h1 {
      margin: 0; font: 400 clamp(6rem, 32vw, 12rem)/.85 "Anton", Impact, sans-serif; color: var(--pink);
      text-shadow: 0 0 2px #fff, 0 0 10px var(--pink), 0 0 28px rgba(255, 46, 147, .8);
    }
    p { margin: 20px 0 0; font-size: 1.1rem; line-height: 1.45; color: var(--muted); }
    p span { display: block; margin-top: 4px; font-size: .95rem; }
    a {
      display: inline-block; margin-top: 32px; padding: 16px 28px; border-radius: 999px;
      background: var(--pink); color: var(--ink); text-decoration: none;
      font: 400 1.25rem/1 "Anton", Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    }
    a:hover { background: var(--white); }
    a:focus-visible { outline: 3px solid var(--white); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo-giselz.png" alt="GISELZ" width="778" height="316">
    <h1>404</h1>
    <p>Esta página no existe… pero la fiesta sigue en la web.<span lang="en">This page doesn’t exist, but the party goes on.</span></p>
    <a href="/">Volver a la web</a>
  </main>
</body>
</html>
